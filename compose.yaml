services:
  postgres:
    image: postgres:17
    container_name: spark-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localhost
      POSTGRES_DB: spark_collab
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: spark-server
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres-data:
